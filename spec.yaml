paths:
  /identity/api/auth/signup:
    post:
      summary: POST signup
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  status:
                    type: number
              example:
                message: User registered successfully! Please Login.
                status: 200
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                email:
                  type: string
                number:
                  type: string
                password:
                  type: string
            example:
              name: testuser
              email: user@test.com
              number: '0786543898'
              password: Test#1234
