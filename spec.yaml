  /workshop/api/shop/products:
    get:
      summary: GET products
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  products:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: number
                        name:
                          type: string
                        price:
                          type: string
                        image_url:
                          type: string
                  credit:
                    type: number
                  next_offset:
                    type: object
                    nullable: true
                  previous_offset:
                    type: object
                    nullable: true
                  count:
                    type: number
              example:
                products:
                - id: 2
                  name: Wheel
                  price: '10.00'
                  image_url: images/wheel.svg
                - id: 1
                  name: Seat
                  price: '10.00'
                  image_url: images/seat.svg
                credit: 100.0
                next_offset:
                previous_offset:
                count: 2
      parameters:
      - name: limit
        in: query
        required: false
        schema:
          type: number
      - name: offset
        in: query
        required: false
        schema:
          type: number
  /workshop/api/shop/orders:
    post:
      summary: POST orders
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: number
                  message:
                    type: string
                  credit:
                    type: number
              example:
                id: 6
                message: Order sent successfully.
                credit: 90.0
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                product_id:
                  type: number
                quantity:
                  type: number
            example:
              product_id: 2
              quantity: 1
  /workshop/api/shop/orders/{id}:
    get:
      summary: GET orders by id
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  orders:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: number
                        user:
                          type: object
                          properties:
                            email:
                              type: string
                            number:
                              type: string
                        product:
                          type: object
                          properties:
                            id:
                              type: number
                            name:
                              type: string
                            price:
                              type: string
                            image_url:
                              type: string
                        quantity:
                          type: number
                        status:
                          type: string
                        transaction_id:
                          type: string
                        created_on:
                          type: string
                  next_offset:
                    type: object
                    nullable: true
                  previous_offset:
                    type: object
                    nullable: true
                  count:
                    type: number
              example:
                orders:
                - id: 6
                  user:
                    email: user@test.com
                    number: '0786543898'
                  product:
                    id: 2
                    name: Wheel
                    price: '10.00'
                    image_url: images/wheel.svg
                  quantity: 1
                  status: delivered
                  transaction_id: db9d153c-32a0-4f98-858e-122dbe1eff33
                  created_on: '2026-05-31T07:56:30.286611'
                next_offset:
                previous_offset:
                count: 1
      parameters:
      - name: id
